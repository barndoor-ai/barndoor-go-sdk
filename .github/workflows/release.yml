name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Resolve the toolchain from go.mod, exactly as ci.yml does. This job used to
      # pin `matrix: go-version: ["1.22", "1.23"]`, which is BELOW the module's own
      # `go 1.25.0` directive — so it could not build, and every release since
      # 2026-04-27 failed here. That is why the module proxy still served v1.0.1
      # while the Python and TypeScript SDKs shipped 1.2.0. A hardcoded matrix
      # silently rots the moment go.mod's directive moves; go-version-file cannot.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      # The version this SDK reports lives in the generated client's User-Agent,
      # which is the only place the Go generator puts packageVersion — a Go
      # module has no manifest, because its version IS its git tag. So the tag
      # and the code can disagree, and nothing else would notice.
      #
      # This used to grep a hand-maintained `const Version` in barndoor.go. That
      # file was the old hand-written SDK and is gone; the check would now fail
      # on a missing file for every release. Its rationale still holds, so it
      # moves to where the version actually is.
      #
      # bdai-platform runs the same assertion before it pushes
      # (sdk/go/publish.json's version_probe). This is the second half of that:
      # there, that the generator honoured the version; here, that the tag being
      # cut matches what was generated.
      - name: Generated version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          got="$(grep -oE 'OpenAPI-Generator/[^/]+/go' api/configuration.go | head -1 | cut -d/ -f2)"
          echo "release tag: ${RELEASE_TAG} (want ${want}); api/configuration.go reports ${got}"
          if [ -z "$got" ]; then
            echo "::error::could not read a version from api/configuration.go. The generated client is missing or its User-Agent changed shape; check the delivery from bdai-platform."
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::the generated client is ${got} but the release tag is ${RELEASE_TAG}. Tag the commit whose delivery carried ${want}, or every client's User-Agent will misreport its version."
            exit 1
          fi

      # Go resolves this module by its path, so a v2+ tag on a module path that
      # does not end in /v2 is served to nobody. Cheap to check, permanent to
      # get wrong: the proxy caches a tag immutably.
      - name: Module path matches the tag's major version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          major="$(echo "${RELEASE_TAG#v}" | cut -d. -f1)"
          path="$(go list -m)"
          echo "tag major: v${major}; module path: ${path}"
          if [ "$major" -ge 2 ] && [ "${path##*/}" != "v${major}" ]; then
            echo "::error::${RELEASE_TAG} needs the module path to end in /v${major}, but it is ${path}. Go would serve this tag to nobody."
            exit 1
          fi

      - name: Build, test, and verify module
        run: make build test-race verify
